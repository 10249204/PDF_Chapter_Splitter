[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf-chapter-splitter"
version = "1.0.0"
description = "A Windows desktop tool for splitting PDFs by chapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.24",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "PyInstaller>=6.0",
    "pytest>=8.0",
]

[project.scripts]
pdf-chapter-splitter = "pdf_chapter_splitter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_chapter_splitter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
